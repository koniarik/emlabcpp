name: Tests

on: [push]

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                compiler: [gcc, clang]
                preset: [debug, asan, ubsan, release]
        uses: ./.github/workflows/arch_base.yml
        with:
            cmd: CC=${{ matrix.compiler }} CXX=${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }} make test PRESET=${{ matrix.preset }}
    clang_tidy:
        uses: ./.github/workflows/arch_base.yml
        with:
            cmd: CC=clang CXX=clang++ make clang-tidy
    install:
        uses: ./.github/workflows/arch_base.yml
        with:
            cmd: >-
                cmake -S . -B _build/install -G Ninja -DCMAKE_INSTALL_PREFIX=$PWD/_install &&
                cmake --build _build/install --target install &&
                cmake -S tests/install -B _build/install-consumer -G Ninja -DCMAKE_PREFIX_PATH=$PWD/_install &&
                cmake --build _build/install-consumer &&
                ./_build/install-consumer/consumer
    windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4

            - name: set up MSVC environment
              uses: ilammy/msvc-dev-cmd@v1

            - name: configure
              run: cmake --preset windows-debug

            - name: build
              run: cmake --build --preset windows-debug

            - name: test
              run: ctest --preset windows-debug --output-on-failure
    pre-commit:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.x"

            - uses: pre-commit/action@v3.0.1
