name: Tests

on: [push]

jobs:
    gcc_test:
        uses: koniarik/emlabcpp/.github/workflows/arch_base.yml@main
        with:
            cmd: make test
    gcc_test_undefined:
        uses: koniarik/emlabcpp/.github/workflows/arch_base.yml@main
        with:
            cmd: make test PRESET=ubsan
    gcc_test_address:
        uses: koniarik/emlabcpp/.github/workflows/arch_base.yml@main
        with:
            cmd: make test PRESET=asan
    clang_test:
        uses: koniarik/emlabcpp/.github/workflows/arch_base.yml@main
        with:
            cmd: CXX=clang++ CC=clang make test PRESET=debug
    clang_tidy:
        uses: koniarik/emlabcpp/.github/workflows/arch_base.yml@main
        with:
            cmd: make clang-tidy
    pre-commit:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.x"

            - uses: pre-commit/action@v3.0.1
