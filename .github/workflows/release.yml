name: Release

on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                preset: [debug, asan, ubsan, release]
        uses: ./.github/workflows/arch_base.yml
        with:
            cmd: make test PRESET=${{ matrix.preset }}
    release:
        needs: test
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - name: check that the tag matches the CMake project version
              run: grep -qxF "project(emlabcpp VERSION ${GITHUB_REF_NAME#v})" CMakeLists.txt

            - uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
